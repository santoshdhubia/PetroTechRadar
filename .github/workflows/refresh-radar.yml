name: Refresh PetroTechRadar

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"  # Sunday 09:00 IST
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-radar.yml"
      - "scripts/discover_repositories.py"
      - "scripts/generate_issue_activity.py"
      - "scripts/sync_dashboard_index.py"
      - "catalog/ADDITIONAL_REPOSITORIES.csv"

permissions:
  contents: write

concurrency:
  group: petrotechradar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover new subsurface repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: python scripts/discover_repositories.py

      - name: Refresh GitHub repository metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_github_metrics.py

      - name: Generate repository matrices and dashboard data
        run: python scripts/generate_outputs.py

      - name: Generate Community Pulse issue activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: python scripts/generate_issue_activity.py

      - name: Refresh paper citations and GitHub metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        continue-on-error: true
        run: python scripts/update_paper_metrics.py

      - name: Generate Papers with Code outputs
        run: python scripts/generate_paper_outputs.py

      - name: Synchronize dashboard navigation and live counts
        run: python scripts/sync_dashboard_index.py

      - name: Show discovery and paper refresh summary
        shell: bash
        run: |
          echo "Repository discovery summary:"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('catalog/discovery_summary.json')
          if p.exists():
              d=json.load(p.open(encoding='utf-8'))
              print(f"Raw unique repositories: {d.get('raw_unique',0)}")
              print(f"New candidates: {d.get('new_candidates',0)}")
              print(f"Auto-added: {d.get('auto_added',0)}")
              print(f"Review only: {d.get('review_only',0)}")
          else:
              print('No discovery summary generated.')
          PY

          echo "Papers with Code refresh summary:"
          python - <<'PY'
          import csv
          from pathlib import Path

          p = Path("catalog/PAPERS_WITH_CODE.csv")
          rows = list(csv.DictReader(p.open(encoding="utf-8")))

          cited = [r for r in rows if str(r.get("citations","")).strip() not in ("","0")]
          gh = [r for r in rows if str(r.get("repo_stars","")).strip() != ""]
          errors = [r for r in rows if "error" in str(r.get("metrics_status","")).lower()]
          stale = [r for r in rows if "stale-preserved" in str(r.get("metrics_status","")).lower()]
          unavailable = [r for r in rows if "citation-unavailable" in str(r.get("metrics_status","")).lower()]

          print(f"Total paper-code pairs: {len(rows)}")
          print(f"Papers with citation data: {len(cited)}")
          print(f"Papers with GitHub metrics: {len(gh)}")
          print(f"Rows with errors: {len(errors)}")
          print(f"Rows using preserved citation data: {len(stale)}")
          print(f"Rows with citation service unavailable: {len(unavailable)}")

          if rows and not cited:
              print("WARNING: No citation data is currently available. Repository metrics will still be committed.")
          PY

      - name: Commit refreshed radar
        shell: bash
        run: |
          git config user.name "Santosh Dhubia"
          git config user.email "santoshdhubia@users.noreply.github.com"

          git add catalog/PETROTECHRADAR_V1.csv
          git add catalog/ADDITIONAL_REPOSITORIES.csv
          git add catalog/DISCOVERY_CANDIDATES.csv
          git add catalog/discovery_summary.json
          git add catalog/metrics_refresh_status.json
          git add catalog/TOP_REPOSITORIES.md
          git add catalog/EMERGING_RADAR.md
          git add catalog/RESEARCH_RADAR.md
          git add catalog/SEISMIC_RADAR.md
          git add catalog/AI_AGENT_RADAR.md
          git add docs/data/radar.json
          git add docs/data/radar.csv
          git add docs/data/stats.json
          git add docs/data/issues.json
          git add docs/issues.html
          git add docs/index.html

          git add catalog/PAPERS_WITH_CODE.csv
          git add catalog/PAPERS_WITH_CODE.md
          git add catalog/TOP_CITED_PAPERS.md
          git add docs/data/papers.json
          git add README.md

          if git diff --cached --quiet; then
            echo "No metric changes."
            exit 0
          fi

          git commit -m "Refresh PetroTechRadar metrics and discovery"
          git push
