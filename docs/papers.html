<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PetroTechRadar — Papers with Code</title><style>body{font-family:system-ui;margin:0;background:#08111f;color:#e9f1fb}.w{max-width:1400px;margin:auto;padding:28px}a{color:#9fc0ff}input,select{padding:11px;background:#101b2d;color:white;border:1px solid #263955;border-radius:9px}.c{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:18px 0}.b{overflow:auto;border:1px solid #263955;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{padding:10px;border-bottom:1px solid #263955;text-align:left}th{background:#0d1829}.s{color:#46c2a9;font-weight:700}</style></head><body><div class="w"><a href="./">← Main radar</a><h1>📚 Papers with Code</h1><p>Geophysics and computational-geophysics papers with reproducible code. Citation impact is included, but age-normalized.</p><div class="c"><input id="q" placeholder="Search paper, topic, journal"><select id="topic"><option value="">All topics</option></select><select id="sort"><option value="score">Paper score</option><option value="citations">Citations</option><option value="velocity">Citations/year</option><option value="stars">GitHub stars</option></select></div><div class="b"><table><thead><tr><th>#</th><th>Paper</th><th>Journal</th><th>Year</th><th>Topic</th><th>Citations</th><th>Cit./yr</th><th>GitHub ★</th><th>Repro.</th><th>Score</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>let all=[];const n=v=>Number(v)||0;function render(){const q=document.getElementById('q').value.toLowerCase(),t=document.getElementById('topic').value,s=document.getElementById('sort').value;let r=all.filter(x=>(`${x.paper_title} ${x.topic} ${x.journal}`.toLowerCase().includes(q))&&(!t||x.topic===t));r.sort((a,b)=>s==='citations'?n(b.citations)-n(a.citations):s==='velocity'?n(b.citations_per_year)-n(a.citations_per_year):s==='stars'?n(b.repo_stars)-n(a.repo_stars):n(b.papers_with_code_score)-n(a.papers_with_code_score));rows.innerHTML=r.map((x,i)=>`<tr><td>${i+1}</td><td>${x.paper_url?`<a href="${x.paper_url}" target="_blank">${x.paper_title}</a>`:x.paper_title}<br><a href="${x.repo_url}" target="_blank">GitHub code</a></td><td>${x.journal}</td><td>${x.year}</td><td>${x.topic}</td><td>${x.citations||'—'}</td><td>${x.citations_per_year||'—'}</td><td>${x.repo_stars||'—'}</td><td>${x.reproducibility}</td><td class="s">${x.papers_with_code_score||'—'}</td></tr>`).join('')}fetch('./data/papers.json').then(r=>r.json()).then(d=>{all=d.papers||[];[...new Set(all.map(x=>x.topic))].sort().forEach(v=>{let o=document.createElement('option');o.value=o.textContent=v;topic.appendChild(o)});['q','topic','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render));render()})</script></body></html>
